name: ShopBot CI/CD Pipeline

on:
  push:
    branches: [ main, shopbot-mvp, develop ]
  pull_request:
    branches: [ main, shopbot-mvp ]

env:
  NODE_VERSION: '18.x'
  MONGODB_URI: mongodb://localhost:27017/shopbot-test

jobs:
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:check
        continue-on-error: true

      - name: Run Prettier check
        run: npm run format:check
        continue-on-error: true

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongo
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wait for MongoDB
        run: |
          until nc -z localhost 27017; do
            echo "Waiting for MongoDB..."
            sleep 2
          done

      - name: Run backend unit tests
        run: npm run test:backend:unit
        env:
          NODE_ENV: test
          MONGODB_URI: ${{ env.MONGODB_URI }}

      - name: Run backend integration tests
        run: npm run test:backend:integration
        env:
          NODE_ENV: test
          MONGODB_URI: ${{ env.MONGODB_URI }}

      - name: Run backend security tests
        run: npm run test:backend:security
        env:
          NODE_ENV: test
          MONGODB_URI: ${{ env.MONGODB_URI }}

      - name: Run backend performance tests
        run: npm run test:backend:performance
        env:
          NODE_ENV: test
          MONGODB_URI: ${{ env.MONGODB_URI }}

      - name: Generate backend coverage report
        run: npm run test:backend:coverage
        env:
          NODE_ENV: test
          MONGODB_URI: ${{ env.MONGODB_URI }}

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./apps/backend/coverage/lcov.info
          flags: backend
          name: backend-coverage

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test:frontend:unit
        env:
          NODE_ENV: test

      - name: Run frontend integration tests
        run: npm run test:frontend:integration
        env:
          NODE_ENV: test

      - name: Run frontend accessibility tests
        run: npm run test:frontend:a11y
        env:
          NODE_ENV: test

      - name: Run frontend performance tests
        run: npm run test:frontend:performance
        env:
          NODE_ENV: test

      - name: Generate frontend coverage report
        run: npm run test:frontend:coverage
        env:
          NODE_ENV: test

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./apps/frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongo
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend
        env:
          NODE_ENV: production

      - name: Start backend server
        run: npm run start:backend &
        env:
          NODE_ENV: test
          MONGODB_URI: ${{ env.MONGODB_URI }}
          PORT: 3001

      - name: Wait for backend server
        run: |
          until curl -f http://localhost:3001/health; do
            echo "Waiting for backend server..."
            sleep 5
          done

      - name: Start frontend server
        run: npm run start:frontend &
        env:
          NODE_ENV: test
          NEXT_PUBLIC_API_URL: http://localhost:3001

      - name: Wait for frontend server
        run: |
          until curl -f http://localhost:3000; do
            echo "Waiting for frontend server..."
            sleep 5
          done

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:3001

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run security linting
        run: npm run lint:security
        continue-on-error: true

      - name: Run dependency vulnerability check
        run: npm run security:deps
        continue-on-error: true

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: [lint-and-format, backend-tests, frontend-tests, e2e-tests, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/shopbot-mvp'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build:backend
        env:
          NODE_ENV: production

      - name: Build frontend
        run: npm run build:frontend
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ secrets.PRODUCTION_API_URL }}

      - name: Run production smoke tests
        run: npm run test:smoke
        env:
          NODE_ENV: production

      - name: Create deployment package
        run: |
          mkdir -p deployment
          cp -r apps/backend/dist deployment/backend
          cp -r apps/frontend/.next deployment/frontend
          cp -r apps/frontend/public deployment/frontend/public
          cp package.json deployment/
          cp -r node_modules deployment/

      - name: Deploy to staging
        if: github.ref == 'refs/heads/develop'
        run: |
          echo "Deploying to staging environment..."
          # Add staging deployment commands here

      - name: Deploy to production
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/shopbot-mvp'
        run: |
          echo "Deploying to production environment..."
          # Add production deployment commands here

      - name: Post-deployment health check
        run: |
          echo "Running post-deployment health checks..."
          npm run health:check:production

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment failed"
          fi

  performance-monitoring:
    name: Performance Monitoring
    runs-on: ubuntu-latest
    needs: [build-and-deploy]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/shopbot-mvp'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run performance benchmarks
        run: npm run test:performance:benchmark
        env:
          NODE_ENV: production

      - name: Monitor Core Web Vitals
        run: npm run monitor:web-vitals
        env:
          NODE_ENV: production

      - name: Generate performance report
        run: npm run report:performance
        env:
          NODE_ENV: production

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [build-and-deploy]
    if: failure() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/shopbot-mvp')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute rollback procedure
        run: |
          echo "🔄 Initiating rollback procedure..."
          npm run deploy:rollback
          
      - name: Verify rollback success
        run: |
          echo "✅ Verifying rollback..."
          npm run health:check:production

      - name: Notify rollback completion
        run: |
          echo "📢 Rollback completed successfully"
