<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopBot - Your Shopping Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        .chat-container {
            max-width: 800px;
            margin: 2rem auto;
            background: white;
            border-radius: 1rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .chat-header {
            background: linear-gradient(135deg, #4a6bdf, #3a5bd0);
            color: white;
            padding: 1.5rem;
            text-align: center;
        }
        .chat-messages {
            height: 400px;
            overflow-y: auto;
            padding: 1rem;
            background-color: #f8f9fa;
        }
        .message {
            margin-bottom: 1rem;
            display: flex;
            align-items: flex-start;
        }
        .message.user {
            justify-content: flex-end;
        }
        .message.bot {
            justify-content: flex-start;
        }
        .message-bubble {
            max-width: 70%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            word-wrap: break-word;
        }
        .message.user .message-bubble {
            background-color: #4a6bdf;
            color: white;
            border-bottom-right-radius: 0.25rem;
        }
        .message.bot .message-bubble {
            background-color: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 0.25rem;
        }
        .chat-input {
            padding: 1rem;
            background: white;
            border-top: 1px solid #e0e0e0;
        }
        .typing-indicator {
            display: none;
            padding: 0.5rem 1rem;
            font-style: italic;
            color: #666;
        }
        .bot-avatar {
            width: 32px;
            height: 32px;
            background: #4a6bdf;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin-right: 0.5rem;
            font-size: 0.8rem;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            background: #28a745;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin-left: 0.5rem;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="chat-container">
            <div class="chat-header">
                <h2>🛒 ShopBot</h2>
                <p class="mb-0">Your AI Shopping Assistant</p>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="message bot">
                    <div class="bot-avatar">SB</div>
                    <div class="message-bubble">
                        Hello! Welcome to ShopBot. I'm your AI shopping assistant. I can help you with products, pricing, shipping, and returns. How can I help you today?
                    </div>
                </div>
            </div>
            
            <div class="typing-indicator" id="typingIndicator">
                ShopBot is typing...
            </div>
            
            <div class="chat-input">
                <form id="chatForm" class="d-flex gap-2">
                    <input 
                        type="text" 
                        id="messageInput" 
                        class="form-control" 
                        placeholder="Type your message here..." 
                        autocomplete="off"
                        required
                    >
                    <button type="submit" class="btn btn-primary" id="sendButton">
                        Send
                    </button>
                </form>
            </div>
        </div>
        
        <div class="text-center mt-3">
            <a href="/" class="btn btn-outline-secondary">← Back to API Docs</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        class ChatBot {
            constructor() {
                this.sessionId = null;
                this.messagesContainer = document.getElementById('chatMessages');
                this.messageInput = document.getElementById('messageInput');
                this.chatForm = document.getElementById('chatForm');
                this.sendButton = document.getElementById('sendButton');
                this.typingIndicator = document.getElementById('typingIndicator');
                
                this.initializeEventListeners();
            }
            
            initializeEventListeners() {
                this.chatForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.sendMessage();
                });
                
                this.messageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });
            }
            
            async sendMessage() {
                const message = this.messageInput.value.trim();
                if (!message) return;
                
                // Disable input while processing
                this.setInputState(false);
                
                // Add user message to chat
                this.addMessage(message, 'user');
                
                // Clear input
                this.messageInput.value = '';
                
                // Show typing indicator
                this.showTyping(true);
                
                try {
                    // Send message to API
                    const response = await fetch('/api/chat/message', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: message,
                            sessionId: this.sessionId
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        // Update session ID
                        this.sessionId = data.data.sessionId;
                        
                        // Add bot response to chat
                        this.addMessage(data.data.botResponse, 'bot');
                    } else {
                        this.addMessage('Sorry, I encountered an error. Please try again.', 'bot');
                        console.error('Chat API error:', data.error);
                    }
                } catch (error) {
                    console.error('Network error:', error);
                    this.addMessage('Sorry, I\'m having trouble connecting. Please check your internet connection and try again.', 'bot');
                }
                
                // Hide typing indicator and re-enable input
                this.showTyping(false);
                this.setInputState(true);
                this.messageInput.focus();
            }
            
            addMessage(text, sender) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}`;
                
                const avatar = document.createElement('div');
                avatar.className = sender === 'bot' ? 'bot-avatar' : 'user-avatar';
                avatar.textContent = sender === 'bot' ? 'SB' : 'U';
                
                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                bubble.textContent = text;
                
                if (sender === 'user') {
                    messageDiv.appendChild(bubble);
                    messageDiv.appendChild(avatar);
                } else {
                    messageDiv.appendChild(avatar);
                    messageDiv.appendChild(bubble);
                }
                
                this.messagesContainer.appendChild(messageDiv);
                this.scrollToBottom();
            }
            
            setInputState(enabled) {
                this.messageInput.disabled = !enabled;
                this.sendButton.disabled = !enabled;
                this.sendButton.textContent = enabled ? 'Send' : 'Sending...';
            }
            
            showTyping(show) {
                this.typingIndicator.style.display = show ? 'block' : 'none';
                if (show) {
                    this.scrollToBottom();
                }
            }
            
            scrollToBottom() {
                setTimeout(() => {
                    this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
                }, 100);
            }
        }
        
        // Initialize chatbot when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new ChatBot();
        });
    </script>
</body>
</html>
